<div class="d-flex flex-row  w-100"
    ng-controller="patientController as patient">

    <div class="d-flex  flex-column border align-items-start justify-content-start bg-light w-auto">
       
        <div class="d-flex  flex-row w-100 align-items-center w-100">
            <div class="d-flex align-items-center bg-light mx-2 w-100">
                <img src="../../hospital.png" class=" d-flex rounded mx-auto d-block mt-2"  height="30" width="30" alt="...">
                <div class="d-flex bg-webbg text-danger rounded-4 flex-fill fs-3 h5 mt-3 p-2 w-100">MAX&nbsp;CARE</div>     
            </div>
            
           
            <div class="d-flex bg-webbg ms-5 me-3 w-auto">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="26" fill="currentColor" class="bi bi-x" viewBox="0 0 16 16">
                    <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708"/>
                  </svg>
     
            </div>
        
    
        </div>
       <div class="d-flex flex-column w-100 shadow-sm min-vh-100">
        <div class="d-flex bg-webbg text-black fs-6 h5 p-2 rounded-2 w-100 ">Main</div>
        <div ui-sref="{{item.url}}" ng-repeat="item in patient.sideNaviagtion track by $index" class="d-flex bg-webbg align-items-center text-body-secondary h6 p-2 w-100 clear-fix  "><i class="{{item.icon}}" style="font-size: 1.5rem;"></i>&nbsp;{{item.name}}</div>


       </div>
    </div>

    <div ui-view="" class="d-flex  flex-column  align-items-start justify-content-start bg-light w-100">



    </div>
   



   

   

    
</div>
