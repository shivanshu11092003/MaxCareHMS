<div class="d-flex flex-row flex-fill align-items-center justify-content-center bg-light min-vh-100" 
    ng-controller="registerController as register">

    <div class="d-md-flex d-none  flex-column  align-items-center rounded-3  bg-light">
        <dotlottie-player src="https://lottie.host/341dc5a7-ddde-4228-a54b-59bf10315440/kmMd6WquXj.json" style="height: 60rem;" background="transparent" speed="1"  direction="1" playMode="normal" loop  autoplay></dotlottie-player>
    </div>
   
    <form  id="form" class="d-flex flex-column align-items-center justify-content-center rounded-3  bg-light">

        <div class="container-fluid d-flex">
            <div class="container-fluid bg-webbg text-danger rounded-4 fs-4 h5 mt-3 px-1">Registration
     
            </div>
            <img src="../../hospital.png" class="rounded mx-auto d-block mt-2"  height="40" width="40" alt="...">
    
    
        </div>

        
        <div class="d-flex flex-column flex-sm-row  mt-1 w-100 px-2">
            <div class="form-floating w-auto flex-fill p-1 ">
                <input type="text" class="form-control" id="fname" placeholder="name@example.com" required>
                <label for="fname" name="fname" class="d-flex fs-7">First Name<div class="text-danger"> &nbsp;*</div></label>
            </div>
            <div class="form-floating w-auto flex-fill p-1">
                <input type="text" class="form-control" id="lname" placeholder="Password" required>
                <label for="lname" name="lname" class="d-flex">Last Name <div class="text-danger"> &nbsp;*</div></label>
            </div>


        </div>
        <div class="d-flex flex-column flex-sm-row justify-content-between mt-1 w-100 px-2">
            <div class="form-floating w-auto flex-fill p-1 ">
                <input type="email" class="form-control" id="email" placeholder="name@example.com" required autocomplete="email">
                <label for="email" name="email" class="d-flex">Email <div class="text-danger"> &nbsp;*</div></label>
            </div>
            <div class="form-floating w-auto flex-fill p-1">
                <input type="number" class="form-control" id="mobileNo" placeholder="Password" required>
                <label for="mobileNo" name="mobileNo" class="d-flex">Mobile Number<div class="text-danger"> &nbsp;*</div></label>
            </div>
            <div class="form-floating w-auto flex-fill p-1">
                <input type="number" class="form-control" id="emergencyNo" placeholder="Password" required>
                <label for="emergencyNo" name="emergencyNo" class="d-flex">Emergency No.</label>
            </div>
        </div>

        <div class="d-flex flex-row justify-content-between mt-1 w-100 px-2">
            <div class="form-floating  w-auto flex-fill p-1 ">
                <select class="form-select" id="gender" name="gender" required>
                    <option selected>Select</option>
                    <option value="Diabitic">Male</option>
                    <option value="Non-Diabitic<">Female</option>

                </select>
                <label for="gender" class="d-flex">Gender<div class="text-danger"> &nbsp;*</div></label>
            </div>
            <div class="form-floating  w-auto flex-fill p-1 ">
                <select class="form-select" id="maritalStatus" name="maritalStatus" required>
                    <option selected>Select </option>
                    <option value="Diabitic">Married</option>
                    <option value="Non-Diabitic<">Un-Married</option>

                </select>
                <label for="maritalStatus" >Marital Status</label>
            </div>
            <div class="form-floating  w-auto flex-fill p-1">
                <input type="Date" class="form-control" id="dob" name="dob" placeholder="dob">
                <label for="dob" class="d-flex">DOB<div class="text-danger"> &nbsp;*</div></label>
            </div>
        </div>
        <div class="d-flex flex-row justify-content-between mt-1 w-100 px-2">
            <div class="form-floating w-auto flex-fill p-1 ">
                <input type="number" step="0.01" class="form-control" id="Weight" name="Weight" placeholder="name@example.com">
                <label for="Weight" class="d-flex">Weight in kg <div class="text-danger"> &nbsp;*</div></label>
            </div>
            <div class="form-floating w-auto flex-fill p-1">
                <input type="number" step="0.01"    type="password" class="form-control" id="Height" name="Height" placeholder="Password">
                <label for="Height" class="d-flex">Height in cm<div class="text-danger"> &nbsp;*</div></label>
            </div>
        </div>

        <div class="d-flex flex-row justify-content-between mt-1 w-100 px-2">
            <div class="form-floating w-50 p-1">
                <select class="form-select" id="diabitic" name="diabitic" required>
                    <option selected>Select</option>
                    <option value="Diabitic">Diabitic</option>
                    <option value="Non-Diabitic<">Non-Diabitic</option>

                </select>
                <label for="diabitic">Diabitic/Non-Diabitic</label>
            </div>
            <div class="form-floating w-50 p-1">
                <select class="form-select" id="bloodGroup" name="bloodGroup" required>
                    <option selected>Select</option>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                    <option value="B+">AB+</option>
                    <option value="AB-">AB-</option>

                </select>
                <label for="bloodGroup">Blood Group</label>
            </div>
        </div>
        <div class="d-flex flex-row justify-content-between mt-1 w-100 px-2">
            <div class="form-floating  w-50 p-1 ">
                <input type="text" class="form-control" id="allergy" name="allergy" placeholder="name@example.com">
                <label for="allergy">Allergy</label>
            </div>
            <div class="form-floating w-50 p-1">
                <input type="text" class="form-control" id="prvMedIssue" name="prvMedIssue" placeholder="Password">
                <label for="prvMedIssue">Previous Medical issue</label>
            </div>
        </div>
        <div class="d-flex flex-row justify-content-between mt-1 w-100 px-2">
            <div class="form-floating w-50 p-1 ">
                <select class="form-select" name="state" id="state">
                    <option selected>Select</option>
                    <option value="{{item}}" ng-repeat="item in register.stateArray track by $index">{{item}}</option>
                </select>
                <label for="state">State</label>
            </div>
            <div class="form-floating w-50 p-1">
                <input type="text" class="form-control" id="city" name="city" placeholder="text">
                <label for="city" class="d-flex">City<div class="text-danger"> &nbsp;*</div></label>
            </div>
        </div>

        <div class="d-flex flex-row justify-content-between mt-1 px-2 w-100">
            <div class="form-floating w-50 p-1 ">
                <input type="number" class="form-control" name="pincode" id="Pincode" placeholder="name@example.com">
                <label for="Pincode">Pincode</label>
            </div>
            <div class="form-floating w-50 p-1">
                <input type="text" class="form-control" name="address" id="Address" placeholder="Password" autocomplete="address-level1">
                <label for="Address" class="d-flex">Address<div class="text-danger"> &nbsp;*</div></label>
            </div>
        </div>
        <div class="d-flex flex-row justify-content-between mt-1 px-2 w-100">
            <div class="form-floating mb-3 w-50 p-1 ">
                <input type="password" class="form-control" name="password" id="password" placeholder="name@example.com">
                <label for="password"  class="d-flex">Password<div class="text-danger"> &nbsp;*</div></label>
            </div>
            <div class="form-floating w-50 p-1">
                <input type="password" class="form-control" name="cpassword" id="cpassword" placeholder="Password">
                <label for="cpassword" class="d-flex">Confirm Password<div class="text-danger"> &nbsp;*</div></label>
            </div>
        </div>


        <button type="submit" class="btn btn-danger w-25 p-2 mb-3" ng-click="register.submit()">Submit</button>


        <div class="d-flex bg-webbg text-black rounded-4 mb-2">Already Have an Account?<div class="text-danger"  ng-click="register.redirect()"> &nbsp; Login</div></div> 

    </form>





  
   

</div>
