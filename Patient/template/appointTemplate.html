<div class="d-flex flex-fill flex-column border shadow-sm justify-content-start align-self-end min-vh-100 bg-white w-100 rounded-4"
    ng-controller="patientAppointmentController as patientAppoint" >



    <div class="d-flex flex-row  align-items-start justify-content-start w-100 p-2"> 
      
        <div class="d-flex w-100 bg-white align-items-center justify-content- rounded-4 text-danger fs-5 h5 mt-3 px-3">

          <button type="submit" class="d-md-flex bg-white w-auto mt-2 px-3" data-bs-toggle="offcanvas" data-bs-target="#staticBackdrop" aria-controls="staticBackdrop" style="border: 0;" ng-click="patient.show()" >
            <i class="bi bi-list d-md-none"></i>
        </button>

          Appointments
        </div>
        <button type="submit" data-bs-toggle="modal" data-bs-target="#exampleModal" class="btn btn-danger w-auto mt-2 mx-3 p-2">Book&nbsp;Appointment</button>
    
        </div>

        

        <div ng-show="patientAppoint.loader" class="d-flex w-100 flex-row justify-content-center align-items-center min-vh-100 flex-wrap p-4">
          <div class="spinner-border m-5" style="width: 3rem; height: 3rem;" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
      </div>



    <div ng-show="!patientAppoint.loader" class="d-flex flex-row justify-content-center align-items-center flex-wrap p-4">

        <div class="d-flex border rounded-3 m-1 shadow-sm bg-light p-2 m-2" style="min-height: 17rem;" ng-repeat="item in patientAppoint.appointments track by $index">
            <div class="d-flex flex-row p-2 w-100">
              <div class="d-flex align-items-center justify-content-between p-1">
              <div class="d-flex flex-column w-100 fs-6 text-body-secondary ">
                <div class="text-black ">Appointment</div>
                <div class="text-success"> {{item.prefered_date}}</div></div>
            </div>
            <div class="d-flex flex-column p-2 justify-content-between w-100">


              <div class="d-flex align-items-center text-black mt-1 p-1">Symptoms:&nbsp;<div class="text-body-secondary">{{item.symptoms}}</div></div>
              <div class="d-flex align-items-center text-black mt-1 p-1">Doctor:&nbsp; <div class="text-body-secondary">{{item.doctor__first_name}} {{item.doctor__last_name}}</div></div>
              <div class="d-flex align-items-center text-black mt-1 p-1">Doctor Fee's:&nbsp; <div class="text-black">₹ {{item.doctor__doc_fee}}</div></div>
              <div class="d-flex align-items-center text-black mt-1 p-1">Status:<div class="text-success font-weight-bold">&nbsp;{{item.status}}</div></div>
              <div class="d-flex align-items-center justify-content-end  text-black mt-1 "><button type="submit"  class="btn {{item.btn_class}}  w-auto"  ng-click="patientAppoint.book()">Pay Now</button></div>

            </div>
          </div>

    </div>

    <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog  modal-dialog-centered modal-dialog-scrollable">
          <div class="modal-content">
            <div class="modal-header">
              <h1 class="modal-title fs-5" id="exampleModalLabel">
                <div class="container-fluid d-flex w-auto align-items-center  flex-fill">
                    
                    <div class="container-fluid bg-webbg  rounded-4 text-black fs-4 h5 mt-3 px-2">Book Appointment</div>    
                    <img src="../../hospital.png" class="rounded mx-auto d-block mt-2"  height="30" width="30" alt="...">
                
                </div>
              </h1>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body d-flex flex-fill flex-column border align-items-center shadow-sm justify-content-start bg-light">
                <form id="form" class="d-flex flex-column  align-items-center justify-content-center w-100  mt-2   bg-transparent">
        
             
                
                 
                    <div class="d-flex flex-row justify-content-between mt-1 w-100 px-2">
            
                    <div class="form-floating mb-3 p-1 w-100 flex-fill">
                        <input type="text" class="form-control" name="symptoms" maxlength="35" id="symptoms" placeholder="name@example.com" autocomplete="email" required>
                        <label for="symptoms" name="symptoms" class="d-flex">Symptoms</label>
                    </div>
                    </div>
            
                    <div class="d-flex flex-row justify-content-between mt-1 w-100 px-2">
                    
                    <div class="form-floating mb-3 p-1  w-auto flex-fill">
                    <input type="date" class="form-control" name="suffer_date" id="Pincode" placeholder="">
                    <label for="Pincode" class="d-flex">Suffer from</label>
                    </div>
            
                    <div class="form-floating mb-3 p-1  w-auto flex-fill">
                    <input type="date" class="form-control"  name="preferred_date" id="Pincode" placeholder="">
                    <label for="Pincode" class="d-flex">preferred_date</label>
                    </div>
            
                    </div>
            
                    <div class="d-flex flex-row justify-content-between mt-1 w-100 px-2">
            
                   
                    <div class="form-floating w-50 mb-3 p-1  flex-fill">
                        <select class="form-select" id="specialization" name="specialization" ng-model="patientAppoint.specialization">
                            <option value="">Select </option>
                            <option value="{{item}}" ng-repeat="item in patientAppoint.specializationArray">{{item}}</option>
            
            
                        </select>
                        <label for="specialization">specialization</label>
                        <div class="text-danger" ng-show="patientAppoint.degree">Put valid issue</div>
            
                    </div>
                    <div class="form-floating w-50 mb-3 p-1  flex-fill">
                        <select class="form-select" id="doctors" name="doc_id">
                            <option value="">Select </option>
                            <option value="{{item.id}}" ng-repeat="item in patientAppoint.doctors | filter:patientAppoint.specialization">{{item.first_name}}</option>
            
            
                        </select>
                        <label for="degree">Doctor</label>
                        <div class="text-danger" ng-show="patientAppoint.degree">Put valid issue</div>
            
                    </div>
                  </div>            
            
                </form>
            
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-black" data-bs-dismiss="modal">Close</button>
              <button type="button" class="btn btn-danger"  ng-click="patientAppoint.book()"  >Book</button>
            </div>
          </div>
        </div>
      </div>




</div>
