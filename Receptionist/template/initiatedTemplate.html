<div class="d-flex flex-fill flex-column border shadow-sm justify-content-start bg-white w-100 rounded-4"
ng-controller="initiatedController as pendingAppointments" >



    <div class="d-flex flex-row  align-items-start justify-content-start w-100 p-3"> 
        <div class="d-flex w-100 bg-webbg  rounded-4 text-danger fs-5 h5 mt-3 px-3">
            <i class="bi bi-list d-flex d-md-none m-1"></i>
            Initiated Appointments</div>
    
        </div>
        <div ng-show="pendingAppointments.loader" class="d-flex w-100 flex-row justify-content-center align-items-center min-vh-100 flex-wrap p-4">
            <div class="spinner-border m-5" style="width: 3rem; height: 3rem;" role="status">
                <span class="visually-hidden">Loading...</span>
              </div>
        </div>
    

        <div ng-show="!pendingAppointments.loader" class="d-flex w-100 flex-row justify-content-center align-items-center flex-wrap p-4">

            <div class="d-flex border rounded-3 m-1 justify-content-center align-items-center shadow-sm bg-light" 
                ng-repeat="item in pendingAppointments.appointments track by $index">
                <div class="d-flex flex-column p-2 m-1 w-100">
                    <div class="d-flex align-items-center justify-content-between p-1">
                        <div class="card-title fs-6 text-body-secondary ">
                            Appointment {{item.id}}<div class="text-success fs-5"> {{item.prefered_date}}</div>
                        </div>
                       
                    </div>
    
                    <div class="d-flex align-items-center text-black mt-3 p-1 h5 fs-6">Patient Name:&nbsp;<div
                            class="text-body-secondary fs-6">{{item.patient__first_name}} {{item.patient__last_name}}</div>
                    </div>
                    <div class="d-flex align-items-center text-black mt-3 p-1 h5 fs-6">Symptoms:&nbsp;<div
                            class="text-body-secondary fs-6">{{item.symptoms}}</div>
                    </div>
                    <div class="d-flex align-items-center text-black mt-2 p-1 fs-6">Doctor:&nbsp; <div
                            class="text-body-secondary fs-6">{{item.doctor__first_name}} {{item.doctor__last_name}}</div>
                    </div>
                    <div class="d-flex align-items-center text-black p-1">Status:<div
                            class="text-success-emphasis font-weight-bold fs-6">&nbsp;{{item.status}}</div>
                    </div>
    
                </div>
            </div>
    
    
    
    
    
        </div>
</div>
