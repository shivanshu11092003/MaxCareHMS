<div class="d-flex flex-fill flex-column border shadow-sm justify-content-start bg-white w-100 rounded-4"
    ng-controller="pendingAppointmentsController as pendingAppointments">



    <div class="d-flex flex-row  align-items-start justify-content-start w-100 p-3">
        <div class="d-flex w-100 bg-webbg  rounded-4 text-danger fs-5 h5 mt-3 px-3"><i
                class="bi bi-list d-flex d-md-none m-1"></i>Pending Appointments</div>

    </div>

    <div ng-show="pendingAppointments.loader" class="d-flex w-100 flex-row justify-content-center align-items-center min-vh-100 flex-wrap p-4">
      
        <div class="spinner-border m-5" style="width: 3rem; height: 3rem;" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
    </div>


    <div ng-show="!pendingAppointments.loader" class="d-flex w-100 flex-row justify-content-start align-items-start flex-wrap p-4">

        <div class="d-flex border rounded-3 m-1 w-100 shadow-sm bg-light"
           >


            <table class="table">
                <thead>
                  <tr class="bg-light">
                    <th scope="col" class="bg-light">Appointment Date</th>
                    <th scope="col" class="bg-light">Patient Name</th>
                    <th scope="col" class="bg-light">Doctor Name</th>
                    <th scope="col" class="bg-light">Symptoms</th>
                    <th scope="col" class="bg-light">Confirm</th>
                    <th scope="col" class="bg-light">reject</th>
                    <th scope="col" class="bg-light">Click here to change reason</th>
                   
                  </tr>
                </thead>
                <tbody>
                  <tr ng-repeat="item in pendingAppointments.appointments track by $index">
                    
                    <td class="text-success fs-5">{{item.prefered_date}}</td>
                    <td>{{item.patient__first_name}} {{item.patient__last_name}}</td>
                    <td>{{item.doctor__first_name}} {{item.doctor__last_name}}</td>
                    <td>{{item.symptoms}}</td>
                    <td>  
                        <button type="submit" class="d-md-flex btn-danger bg-light  mt-2 px-3 d-none" ng-click="pendingAppointments.accept(item.id)"  style="border: 0;" >
                            <i class="bi bi-check2"></i>
                        </button>
                                     
                </td>
                    <td>  <button type="submit" class="d-md-flex bg-light mt-2 px-3 d-none" ng-click="pendingAppointments.reject(item.id)" style="border: 0;">
                        <i class="bi bi-x-circle"></i>
                    </button>
                </td>
                <td>
                    <div class="input-group mb-3">
                        <input type="text" class="form-control" placeholder="remark" ng-model="pendingAppointments.feedBack[item.id]" ng-init="pendingAppointments.feedBack[item.id] = 'Service unavailable'"  aria-label="Username" aria-describedby="basic-addon1">
                        </div>
          
                </td>
                  </tr>
                 
                </tbody>
              </table>
           
        </div>





    </div>
</div>
