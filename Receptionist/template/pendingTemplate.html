<div class="d-flex flex-fill flex-column border shadow-sm justify-content-start min-vh-100 bg-white w-100"
    ng-controller="pendingAppointmentsController as pendingAppointments">



    <div class="d-flex flex-row  align-items-start justify-content-start w-100 p-3">
        <div class="d-flex w-100 bg-webbg  rounded-4 text-danger fs-5 h5 mt-3 px-3"><i
                class="bi bi-list d-flex d-md-none m-1"></i>Pending Appointments</div>

    </div>


    <div class="d-flex w-100 flex-row justify-content-start align-items-start flex-wrap p-4">

        <div class="d-flex border rounded-3 m-1  shadow-sm bg-light" style="width: 19rem;height: 19.5rem;"
            ng-repeat="item in pendingAppointments.appointments track by $index">
            <div class="d-flex flex-column p-2 w-100">
                <div class="d-flex align-items-center justify-content-between p-1">
                    <div class="card-title fs-6 text-body-secondary ">
                        Appointment {{item.id}}<div class="text-success fs-5"> {{item.prefered_date}}</div>
                    </div>
                    <div class="d-flex align-items-center justify-content-center text-black h-100">
                        <button type="submit" class="d-md-flex btn-danger bg-light   w-100 mt-2 px-3 d-none" ng-click="pendingAppointments.accept($index,item.id)"  style="border: 0;" >
                            <i class="bi bi-check2"></i>
                        </button>
                        <button type="submit" class="d-md-flex bg-light  w-100 mt-2 px-3 d-none" ng-click="pendingAppointments.reject(item.id)" style="border: 0;">
                            <i class="bi bi-x-circle"></i>
                        </button>

                    </div>
                </div>

                <div class="d-flex align-items-center text-black mt-3 p-1 h5 fs-6">Patient Name:&nbsp;<div
                        class="text-body-secondary fs-6">{{item.patient__first_name}} {{item.patient__last_name}}</div>
                </div>
                <div class="d-flex align-items-center text-black mt-3 p-1 h5 fs-6">Symptoms:&nbsp;<div
                        class="text-body-secondary fs-6">{{item.symptoms}}</div>
                </div>
                <div class="d-flex align-items-center text-black mt-2 p-1 fs-6">Doctor:&nbsp; <div
                        class="text-body-secondary fs-6">{{item.doctor__first_name}} {{item.doctor__last_name}}</div>
                </div>
                <div class="d-flex align-items-center text-black p-1">Status:<div
                        class="text-success-emphasis font-weight-bold fs-6">&nbsp;{{item.status}}</div>
                </div>



                <div class="input-group mb-3">
                <input type="text" class="form-control" placeholder="remark" ng-model="pendingAppointments.feedBack[item.id]" ng-init="pendingAppointments.feedBack[item.id] = 'Sorry we unable to provide service'"  aria-label="Username" aria-describedby="basic-addon1">
                </div>
  

            </div>
            
        </div>





    </div>
</div>
